<!DOCTYPE html>
<html lang="en">
<head>

<body>

                fill="none"

                <path class="outline" fill="#171A26" d="M68.095 30.54c-6.307 0-11.12-4.897-11.12-10.872 0-5.934 4.855-10.83 11.12-10.83 6.349 0 11.162 4.938 11.162 10.83 0 5.975-4.855 10.871-11.162 10.871Zm0-5.52c3.03 0 5.27-2.406 5.27-5.31 0-2.905-2.24-5.312-5.27-5.312-3.029 0-5.228 2.407-5.228 5.311 0 2.905 2.199 5.312 5.228 5.312ZM43.08 40c-4.813 0-8.506-2.116-10.373-5.934l4.896-2.655c.913 1.784 2.614 3.195 5.394 3.195 3.486 0 5.85-2.448 5.85-6.473v-.374c-1.12 1.411-3.111 2.49-6.016 2.49-5.768 0-10.373-4.481-10.373-10.581 0-5.934 4.813-10.788 11.12-10.788 6.431 0 11.162 4.605 11.162 10.788v8.299C54.74 35.27 49.76 40 43.08 40Zm.415-15.311c2.946 0 5.27-2.2 5.27-5.145 0-2.947-2.324-5.104-5.27-5.104-2.905 0-5.228 2.158-5.228 5.104s2.323 5.145 5.228 5.145ZM20.074 30.54c-6.307 0-11.12-4.897-11.12-10.872 0-5.934 4.854-10.83 11.12-10.83 6.348 0 11.162 4.938 11.162 10.83 0 5.975-4.855 10.871-11.162 10.871Zm0-5.52c3.029 0 5.27-2.406 5.27-5.31 0-2.905-2.241-5.312-5.27-5.312-3.03 0-5.228 2.407-5.228 5.311 0 2.905 2.199 5.312 5.228 5.312ZM0 0h5.892v30H0V0ZM82 6.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z"></path>

            <div class="utility-menu">
                <button id="cartToggle" type="button" aria-label="Open cart" class="cart-toggle">
                    View Cart (<span id="cartCount">0</span>)
                </button>
                <button aria-label="Change to light mode" class="utility-menu--toggle"  data-toggle-class="light-mode" data-click-sound="/src/sounds/click.mp3">
                    <svg fill="currentColor" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 512 512" aria-hidden="true" focusable="false"><path d="M361.5 1.2c5 2.1 8.6 6.6 9.6 11.9L391 121l107.9 19.8c5.3 1 9.8 4.6 11.9 9.6s1.5 10.7-1.6 15.2L446.9 256l62.3 90.3c3.1 4.5 3.7 10.2 1.6 15.2s-6.6 8.6-11.9 9.6L391 391 371.1 498.9c-1 5.3-4.6 9.8-9.6 11.9s-10.7 1.5-15.2-1.6L256 446.9l-90.3 62.3c-4.5 3.1-10.2 3.7-15.2 1.6s-8.6-6.6-9.6-11.9L121 391 13.1 371.1c-5.3-1-9.8-4.6-11.9-9.6s-1.5-10.7 1.6-15.2L65.1 256 2.8 165.7c-3.1-4.5-3.7-10.2-1.6-15.2s6.6-8.6 11.9-9.6L121 121 140.9 13.1c1-5.3 4.6-9.8 9.6-11.9s10.7-1.5 15.2 1.6L256 65.1 346.3 2.8c4.5-3.1 10.2-3.7 15.2-1.6zM160 256a96 96 0 1 1 192 0 96 96 0 1 1 -192 0zm224 0a128 128 0 1 0 -256 0 128 128 0 1 0 256 0z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <aside id="cartSidebar" class="cart-sidebar">
        <button id="closeCart" class="close-cart" aria-label="Close cart">×</button>
        <h2>Your Cart</h2>
        <ul id="cartItems" class="cart-items"></ul>
        <div class="cart-footer">
            <p><strong>Total:</strong> $<span id="cartTotal">0.00</span></p>
            <button id="clearCart" type="button" aria-label="Clear Cart">Clear Cart</button>
        </div>
    </aside>

    <main id="content">
        <div class="wrapper">
            <h1 class="text-center">Mini Products</h1>
            <div class="wrapper--main flex">
                <div class="flex flex-column" id="filters" aria-labelledby="filter-heading">
                    <h2>Filters</h2>
                    <div class="filter-row flex flex-wrap flex-column">
                        <div class="filter-group flex flex-column">
                            <label for="productSearch">Search Products:</label>
                            <input type="text" class="product-search" id="productSearch" placeholder="Search products..." aria-label="Search products by name" />
                        </div>
                        <div class="filter-group flex flex-column">
                            <label for="categoryFilter">Category:</label>
                            <select id="categoryFilter" name="categoryFilter" multiple aria-label="Category Filter"></select>
                        </div>
                        <div class="filter-group price-range">
                            <span>Price Range:</label>
                            <div class="range-inputs flex align-center">
                            <label for="minPrice" class="visually-hidden">Min Price</label>
                            <input type="number" id="minPrice" name="minPrice" placeholder="Min" />
                            <span>–</span>
                            <label for="maxPrice" class="visually-hidden">Max Price</label>
                            <input type="number" id="maxPrice" name="maxPrice" placeholder="Max" />
                            </div>
                        </div>
                    </div>
                    <button id="clearFilters" type="button" aria-label="Clear selected filters">Clear Filters</button>
                </div>
                <div>
                    <p id="productCount" class="product-count" aria-live="polite"></p>
                    <div id="productGrid" role="region" aria-label="Product Grid" class="product text-center">
                        <template id="productCardTemplate">
                            <div class="product--card flex flex-column">
                                <img alt="" class="product--img"/>
                                <h2 class="product--title"></h2>
                                <p class="product--price"><span class="visually-hidden">Price:</span> <span class="price"></span></p>
                                <button type="button" class="add-to-cart">Add to Cart</button>
                            </div>
                        </template>
                    </div>
                     <!-- Pagination -->
                    <div id="pagination-controls">
                        <button id="prevPage" disabled>Previous</button>
                        <span id="pageInfo">Page 1</span>
                        <button id="nextPage">Next</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p class="text-center">&copy; 2025 Lyra Mai</p>
    </footer>
</body>
</html>
